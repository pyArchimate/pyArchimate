name: CI

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: "1"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ── Gate: fail fast if poetry.lock is out of sync with pyproject.toml ─────
  lock-sync:
    name: Lock sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install poetry

      - name: Verify poetry.lock is in sync with pyproject.toml
        run: poetry check --lock

  test:
    name: Test (Python 3.12)
    needs: lock-sync
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          # Key on the resolved Python version: runner-image patch bumps (e.g. 3.13.16 -> 3.13.17)
          # remove the old interpreter from hostedtoolcache, breaking a venv restored across the bump.
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-root  # NOSONAR S8541

      - name: Run pytest
        run: poetry run pytest --cov --cov-branch --cov-report=xml

      - name: Run behave
        env:
          PYTHONIOENCODING: "utf-8"
          PYTHONPATH: src  # --no-root leaves pyArchimate uninstalled; pytest gets this via pythonpath
        run: poetry run behave

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: build/
          if-no-files-found: ignore

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  sonar:
    name: SonarCloud Analysis
    needs: lock-sync
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pipx install poetry
          poetry config virtualenvs.in-project true

      - name: Cache virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          # Key on the resolved Python version: runner-image patch bumps (e.g. 3.13.16 -> 3.13.17)
          # remove the old interpreter from hostedtoolcache, breaking a venv restored across the bump.
          key: venv-ubuntu-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-ubuntu-py${{ steps.setup-python.outputs.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-root  # NOSONAR S8541

      - name: Run pytest with coverage
        run: poetry run pytest --cov --cov-branch --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
